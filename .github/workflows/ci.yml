name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: latest

      - name: Install BLAST+ via pixi
        run: pixi install

      - name: Install local cgview dependency
        run: >
          mvn install:install-file
          -Dfile=cgview/cgview.jar
          -DgroupId=ca.ualberta.stothard.cgview
          -DartifactId=cgview
          -Dversion=2.0.3-SNAPSHOT
          -Dpackaging=jar
          -q

      - run: mvn clean package -q

      - name: Run unit tests
        run: mvn test

      - name: Run E2E tests (requires BLAST+)
        run: pixi run mvn test -Dtest.excludedGroups= -Dgroups=e2e
